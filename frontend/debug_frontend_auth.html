<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Frontend Auth</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔍 Debug Frontend Authentication</h1>
    
    <div class="debug-section info">
        <h3>1. Verificar LocalStorage</h3>
        <button onclick="checkLocalStorage()">Verificar Token</button>
        <div id="localStorage-result"></div>
    </div>

    <div class="debug-section info">
        <h3>2. Testar Login</h3>
        <input type="email" id="email" placeholder="Email" value="admin@scoremvp.com.br" style="width: 200px; padding: 5px;">
        <input type="password" id="password" placeholder="Senha" value="admin123" style="width: 200px; padding: 5px;">
        <button onclick="testLogin()">Fazer Login</button>
        <div id="login-result"></div>
    </div>

    <div class="debug-section info">
        <h3>3. Testar Endpoint de Usuários</h3>
        <button onclick="testUsersEndpoint()">Testar /api/users/</button>
        <div id="users-result"></div>
    </div>

    <div class="debug-section info">
        <h3>4. Verificar Headers da Requisição</h3>
        <button onclick="checkRequestHeaders()">Verificar Headers</button>
        <div id="headers-result"></div>
    </div>

    <script>
        const API_URL = 'https://scoremvpback-production.up.railway.app/api';

        function checkLocalStorage() {
            const token = localStorage.getItem('token');
            const result = document.getElementById('localStorage-result');
            
            if (token) {
                result.innerHTML = `
                    <div class="success">
                        ✅ Token encontrado no localStorage<br>
                        Token: ${token.substring(0, 20)}...
                    </div>
                `;
            } else {
                result.innerHTML = `
                    <div class="error">
                        ❌ Nenhum token encontrado no localStorage
                    </div>
                `;
            }
        }

        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const result = document.getElementById('login-result');
            
            try {
                const formData = new URLSearchParams();
                formData.append('username', email);
                formData.append('password', password);
                
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData
                });
                
                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('token', data.access_token);
                    
                    result.innerHTML = `
                        <div class="success">
                            ✅ Login bem-sucedido!<br>
                            Token salvo no localStorage<br>
                            Usuário: ${data.user?.name || 'N/A'}
                        </div>
                    `;
                } else {
                    const error = await response.text();
                    result.innerHTML = `
                        <div class="error">
                            ❌ Login falhou: ${response.status}<br>
                            Erro: ${error}
                        </div>
                    `;
                }
            } catch (error) {
                result.innerHTML = `
                    <div class="error">
                        ❌ Erro na requisição: ${error.message}
                    </div>
                `;
            }
        }

        async function testUsersEndpoint() {
            const token = localStorage.getItem('token');
            const result = document.getElementById('users-result');
            
            if (!token) {
                result.innerHTML = `
                    <div class="error">
                        ❌ Nenhum token disponível. Faça login primeiro.
                    </div>
                `;
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/users/`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                    }
                });
                
                if (response.ok) {
                    const users = await response.json();
                    result.innerHTML = `
                        <div class="success">
                            ✅ Endpoint funcionando!<br>
                            Usuários encontrados: ${users.length}<br>
                            <pre>${JSON.stringify(users.slice(0, 2), null, 2)}</pre>
                        </div>
                    `;
                } else {
                    const error = await response.text();
                    result.innerHTML = `
                        <div class="error">
                            ❌ Endpoint falhou: ${response.status}<br>
                            Erro: ${error}
                        </div>
                    `;
                }
            } catch (error) {
                result.innerHTML = `
                    <div class="error">
                        ❌ Erro na requisição: ${error.message}
                    </div>
                `;
            }
        }

        function checkRequestHeaders() {
            const token = localStorage.getItem('token');
            const result = document.getElementById('headers-result');
            
            if (!token) {
                result.innerHTML = `
                    <div class="error">
                        ❌ Nenhum token disponível
                    </div>
                `;
                return;
            }
            
            result.innerHTML = `
                <div class="info">
                    <h4>Headers que seriam enviados:</h4>
                    <pre>Authorization: Bearer ${token.substring(0, 20)}...
Content-Type: application/json</pre>
                </div>
            `;
        }

        // Verificar localStorage ao carregar a página
        window.onload = function() {
            checkLocalStorage();
        };
    </script>
</body>
</html>
