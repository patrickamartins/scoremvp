<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evento na Agenda - ScoreMVP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background-color: #AC7F5E;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 5px 5px 0 0;
        }
        .content {
            background-color: #f9f9f9;
            padding: 30px;
            border-radius: 0 0 5px 5px;
        }
        .event-info {
            background-color: white;
            padding: 15px;
            border-left: 4px solid #AC7F5E;
            margin: 20px 0;
        }
        .button {
            display: inline-block;
            padding: 12px 30px;
            background-color: #AC7F5E;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin: 20px 0;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Evento {{ 'Criado' if event_type == 'criado' else 'Removido' }} na Agenda</h1>
    </div>
    <div class="content">
        <p>Olá <strong>{{ user_name }}</strong>,</p>
        <p>Um evento foi {{ 'adicionado' if event_type == 'criado' else 'removido' }} na sua agenda:</p>
        <div class="event-info">
            <p><strong>Título:</strong> {{ event_title }}</p>
            <p><strong>Data:</strong> {{ event_date }}</p>
        </div>
        <p style="text-align: center;">
            <a href="{{ frontend_url }}/agenda" class="button">Ver Agenda</a>
        </p>
    </div>
    <div class="footer">
        <p>© 2025 ScoreMVP. Todos os direitos reservados.</p>
    </div>
</body>
</html>
